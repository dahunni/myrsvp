<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 960px; box-sizing: border-box; background: #0E0E0E; color: #EDEDED; font-family: Inter, sans-serif; display: flex; flex-direction: column; padding: 36px 24px 28px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px 20px">
<h1 style="margin: 0; font-size: 34px; font-weight: 600">Library</h1>
<span style="font-size: 20px; color: #8A8A8A">5 books</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{books}}" as="b" hint-placeholder-count="5">
<button style="{{b.rowStyle}}">
<span style="{{b.titleStyle}}">{{b.title}}</span>
<span style="font-size: 19px; color: #8A8A8A">{{b.author}}</span>
<span style="display: flex; align-items: center; gap: 12px; width: 100%">
<span style="flex-grow: 1; height: 5px; background: #2A2A2A; border-radius: 3px; display: block">
<span style="{{b.barStyle}}"></span>
</span>
<span style="font-size: 18px; color: #8A8A8A; min-width: 56px; text-align: right">{{b.pct}}</span>
</span>
</button>
</sc-for>
<button style="margin-top: 10px; display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 18px; background: transparent; border: 2px dashed #3A3A3A; border-radius: 14px; color: #BDBDBD; font-family: Inter, sans-serif; font-size: 22px; text-align: left">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
Add books via Wi-Fi
</button>
</div>
<div style="display: flex; justify-content: space-between; font-size: 19px; color: #8A8A8A; padding: 16px 8px 0; border-top: 1px solid #222222">
<span>▲▼ Move</span>
<span>OK Open</span>
<span>☰ Menu</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const raw = [
{ title: 'Pride and Prejudice', author: 'Jane Austen', p: 12, done: false },
{ title: 'Meditations', author: 'Marcus Aurelius', p: 47, done: false },
{ title: 'The Time Machine', author: 'H. G. Wells', p: 0, done: false },
{ title: 'Walden', author: 'Henry David Thoreau', p: 0, done: false },
{ title: 'Frankenstein', author: 'Mary Shelley', p: 100, done: true }
];
const books = raw.map((b, i) => ({
title: b.title,
author: b.author,
pct: b.done ? 'Done' : b.p + '%',
rowStyle: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; box-sizing: border-box; padding: 16px 18px; border: 0; border-radius: 14px; font-family: Inter, sans-serif; text-align: left; color: #EDEDED; background: ' + (i === 0 ? '#262626; outline: 3px solid #FF4B3E; outline-offset: -3px' : 'transparent') + (b.done ? '; opacity: 0.5' : ''),
titleStyle: 'font-size: 26px; font-weight: ' + (i === 0 ? '600' : '500'),
barStyle: 'display: block; height: 5px; border-radius: 3px; background: ' + (b.done ? '#5C5C5C' : '#8A8A8A') + '; width: ' + b.p + '%'
}));
return { books };
}
}
</script>
</body>
</html>
