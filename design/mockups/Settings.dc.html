<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 960px; box-sizing: border-box; background: #0E0E0E; color: #EDEDED; font-family: Inter, sans-serif; display: flex; flex-direction: column; padding: 36px 24px 28px">
<div style="padding: 0 8px 24px">
<h1 style="margin: 0; font-size: 34px; font-weight: 600">Settings</h1>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<button style="{{r.rowStyle}}">
<span>{{r.label}}</span>
<span style="{{r.valueStyle}}">{{r.value}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 19px; color: #8A8A8A; padding: 16px 8px 0; border-top: 1px solid #222222">
<span>▲▼ Move</span>
<span>◀▶ Change</span>
<span>↩ Back</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const raw = [
{ label: 'Speed', value: '350 wpm' },
{ label: 'Theme', value: 'Dark' },
{ label: 'Focus letter', value: 'Red' },
{ label: 'Word size', value: 'Large' },
{ label: 'Pause at sentences', value: 'On' },
{ label: 'Ramp-up on start', value: 'On' },
{ label: 'Guide lines', value: 'On' }
];
const rows = raw.map((r, i) => ({
label: r.label,
value: i === 0 ? '◀  ' + r.value + '  ▶' : r.value,
valueStyle: 'font-size: 22px; font-weight: 500; color: ' + (i === 0 ? '#EDEDED' : '#8A8A8A'),
rowStyle: 'display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; padding: 20px 18px; border: 0; border-radius: 14px; font-family: Inter, sans-serif; font-size: 24px; text-align: left; color: #EDEDED; background: ' + (i === 0 ? '#262626; outline: 3px solid #FF4B3E; outline-offset: -3px; font-weight: 600' : 'transparent; font-weight: 500')
}));
return { rows };
}
}
</script>
</body>
</html>
