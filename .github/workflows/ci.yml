# Every push and pull request: unit tests, lint and a debug build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
